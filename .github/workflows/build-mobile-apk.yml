name: Build MORPH Bandar Lampung Android APK

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-apk.yml"
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Release APK (Flutter Stable + Java 17)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Ensure Native Android & Web Scaffolding Exists
        run: flutter create . --platforms=android,web --project-name morph_bandar_lampung --org id.morph

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --dart-define=API_URL=https://frontend-three-smoky-67.vercel.app/api/mobile

      - name: Rename APK Artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MORPH-BandarLampung-Android.apk

      - name: Upload MORPH-BandarLampung-Android.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MORPH-BandarLampung-Android.apk
          path: mobile/build/app/outputs/flutter-apk/MORPH-BandarLampung-Android.apk
          if-no-files-found: error
