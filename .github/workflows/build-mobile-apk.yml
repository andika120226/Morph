name: Build MORPH-BandarLampung.apk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build MORPH-BandarLampung.apk (Flutter Stable + Java 17)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate Clean Android Gradle Scaffolding
        run: |
          rm -rf android
          flutter create . --platforms=android,web --project-name morph_bandar_lampung

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define=API_URL=https://frontend-three-smoky-67.vercel.app/api/mobile

      - name: Prepare MORPH-BandarLampung.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MORPH-BandarLampung.apk

      - name: Upload MORPH-BandarLampung.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MORPH-BandarLampung.apk
          path: mobile/build/app/outputs/flutter-apk/MORPH-BandarLampung.apk
          if-no-files-found: error
